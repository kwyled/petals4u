<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#09030c">
  <title>Petals4U — ASCII Flower Bouquet</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <canvas id="bouquet" aria-label="A rotating ASCII flower bouquet wrapped in paper and ribbon, surrounded by floating hearts"></canvas>
  </main>
  <div class="brand">Petals<span>4U</span></div>
  <button id="settingsToggle" class="settings-toggle" type="button" aria-expanded="false" aria-controls="controlPanel">Options</button>
  <aside id="controlPanel" class="control-panel" aria-hidden="true">
    <header class="panel-header">
      <div>
        <span class="eyebrow">Petals4U</span>
        <h1>Your bouquet</h1>
      </div>
      <button id="closePanel" class="icon-button" type="button" aria-label="Close settings">&times;</button>
    </header>
    <div class="panel-scroll">
      <section>
        <h2>Theme</h2>
        <div class="theme-grid">
          <button type="button" data-theme="valentine" class="theme-button active">Rose</button>
          <button type="button" data-theme="anniversary" class="theme-button">Lilac</button>
          <button type="button" data-theme="birthday" class="theme-button">Sunset</button>
          <button type="button" data-theme="spring" class="theme-button">Spring</button>
          <button type="button" data-theme="memorial" class="theme-button">Memorial</button>
          <button type="button" data-theme="winter" class="theme-button">Winter</button>
        </div>
      </section>
      <section>
        <h2>Flowers</h2>
        <div class="flower-settings-grid">
          <div class="flower-setting">
            <label class="flower-choice"><input type="checkbox" data-kind="rose" checked> Roses</label>
            <label class="flower-option">Color<input type="color" data-flower-color="rose" value="#c51e55" aria-label="Rose color"></label>
            <label class="flower-option">Count<input type="number" data-flower-count="rose" min="0" max="40" value="8" aria-label="Number of roses"></label>
          </div>
          <div class="flower-setting">
            <label class="flower-choice"><input type="checkbox" data-kind="lavender" checked> Lavender</label>
            <label class="flower-option">Color<input type="color" data-flower-color="lavender" value="#aa83eb" aria-label="Lavender color"></label>
            <label class="flower-option">Count<input type="number" data-flower-count="lavender" min="0" max="40" value="2" aria-label="Number of lavender stems"></label>
          </div>
          <div class="flower-setting">
            <label class="flower-choice"><input type="checkbox" data-kind="sunflower" checked> Sunflowers</label>
            <label class="flower-option">Color<input type="color" data-flower-color="sunflower" value="#f0bd30" aria-label="Sunflower color"></label>
            <label class="flower-option">Count<input type="number" data-flower-count="sunflower" min="0" max="40" value="2" aria-label="Number of sunflowers"></label>
          </div>
          <div class="flower-setting">
            <label class="flower-choice"><input type="checkbox" data-kind="tulip" checked> Tulips</label>
            <label class="flower-option">Color<input type="color" data-flower-color="tulip" value="#f4a0c4" aria-label="Tulip color"></label>
            <label class="flower-option">Count<input type="number" data-flower-count="tulip" min="0" max="40" value="2" aria-label="Number of tulips"></label>
          </div>
          <div class="flower-setting">
            <label class="flower-choice"><input type="checkbox" data-kind="daisy" checked> Daisies</label>
            <label class="flower-option">Color<input type="color" data-flower-color="daisy" value="#fafafa" aria-label="Daisy color"></label>
            <label class="flower-option">Count<input type="number" data-flower-count="daisy" min="0" max="40" value="2" aria-label="Number of daisies"></label>
          </div>
        </div>
      </section>
      <section>
        <h2>Motion</h2>
        <label class="range-label">Bouquet size<input id="sizeRange" type="range" min="80" max="140" value="130"></label>
        <label class="range-label">Fullness<input id="densityRange" type="range" min="50" max="130" value="100"></label>
        <label class="range-label">Glow<input id="glowRange" type="range" min="0" max="5" value="1"></label>
        <label class="range-label">Rotation<input id="rotationRange" type="range" min="0" max="150" value="100"></label>
        <div class="action-row">
          <button id="pauseButton" class="secondary-button" type="button">Pause</button>
          <button id="dayNightButton" class="secondary-button" type="button">Night</button>
          <button id="motionButton" class="secondary-button" type="button">Reduce motion</button>
        </div>
      </section>
      <section>
        <h2>Save</h2>
        <div class="export-grid">
          <button id="pngButton" type="button">PNG</button>
          <button id="gifButton" type="button">GIF</button>
        </div>
      </section>
    </div>
  </aside>
  <div id="toast" class="toast" role="status"></div>
  <script src="vendor/gif.js"></script>
  <script type="module" src="bouquet.js"></script>
</body>
</html>
